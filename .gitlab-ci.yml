image: python:3.13-slim

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "0"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

stages:
  - test
  - frontend

# Runs Django tests directly in a Python environment (no Docker-in-Docker)
backend-django-tests:
  stage: test
  tags:
    - shared-docker-runner
  cache:
    key: "$CI_JOB_NAME"
    paths:
      - .cache/pip
  before_script:
    - set -eu
    - python --version
    - pip --version
    - python -m pip install --upgrade pip setuptools wheel
    - pip install -r drinks-ordering-app/backend/requirements.txt
  script:
    - cd drinks-ordering-app/backend
    - export DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-dummy-secret}
    - export DJANGO_SETTINGS_MODULE=barbackend.settings_test
    - export USE_SQLITE_FOR_TESTS=1
    - export USE_LOCAL_FILE_STORAGE=1
    - python manage.py test -v 2
  artifacts:
    when: always
    paths:
      - drinks-ordering-app/backend/test_db.sqlite3
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: on_success
    - if: $CI_COMMIT_BRANCH
      when: on_success

# Frontend tests: admin
admin-frontend-tests:
  image: node:20-alpine
  stage: frontend
  tags:
    - shared-docker-runner
  cache:
    key: "admin-node-modules"
    paths:
      - drinks-ordering-app/admin/node_modules
      - drinks-ordering-app/packages/shared/node_modules
  before_script:
    - set -eu
    - cd drinks-ordering-app/packages/shared && npm ci || npm install && cd -
    - cd drinks-ordering-app/admin && npm ci || npm install
  script:
    - cd drinks-ordering-app/admin
    - npm run test:ci
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# Frontend tests: client
client-frontend-tests:
  image: node:20-alpine
  stage: frontend
  tags:
    - shared-docker-runner
  cache:
    key: "client-node-modules"
    paths:
      - drinks-ordering-app/client/node_modules
      - drinks-ordering-app/packages/shared/node_modules
  before_script:
    - set -eu
    - cd drinks-ordering-app/packages/shared && npm ci || npm install && cd -
    - cd drinks-ordering-app/client && npm ci || npm install
  script:
    - cd drinks-ordering-app/client
    - npm run test:ci
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
