version: "3.9"

services:
  postgres:
    image: postgres:14
    container_name: drinks_postgres
    restart: always
    environment:
      POSTGRES_USER: baruser
      POSTGRES_PASSWORD: barpass
      POSTGRES_DB: barapp_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-tests:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: baruser
      POSTGRES_PASSWORD: barpass
      POSTGRES_DB: barapp_db
      POSTGRES_PORT: 5432
      DJANGO_SETTINGS_MODULE: barbackend.settings
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app
    command: ["python", "manage.py", "test", "-v", "2"]

volumes:
  pgdata: {}
