services:
  postgres:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_USER: baruser
      POSTGRES_PASSWORD: barpass
      POSTGRES_DB: barapp_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./create_db.sql:/docker-entrypoint-initdb.d/create_db.sql:ro

volumes:
  pgdata:
